<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aryan Mirza - TournaX</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- SweetAlert2 CSS -->
<link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-material-ui/material-ui.min.css" rel="stylesheet">

<style>
    /* ================= CSS STYLES ================= */
    :root {
        --primary: #3F51B5;
        --primary-light: #E8EAF6;
        --secondary: #ff9800;
        --success: #43A047;
        --danger: #D32F2F;
        --bg-color: #f5f6fa;
        --text-dark: #1d1b20;
        --white: #ffffff;
        --wallet-gradient: linear-gradient(135deg, #2b1055, #7597de);
        --bkash-color: #E2136E;
        --rocket-color: #8C3494;
        --nagad-color: #F7941D;
        --bkash-dark: #b00e56;
        --rocket-dark: #6a2670;
        --nagad-dark: #c97612;
        --auth-bg-dark: #101010;
        --auth-card-bg: #ffffff;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Lato', 'Hind Siliguri', sans-serif;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        user-select: none;
    }

    input, textarea, select {
        user-select: text;
    }

    body {
        background-color: var(--bg-color);
        padding-bottom: 90px;
        overflow-x: hidden;
        min-height: 100vh;
    }

    /* --- SPLASH SCREEN WITH WHITE DOT PARTICLES --- */
    #app-splash {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: linear-gradient(180deg, #101018 0%, #000000 100%);
        z-index: 10000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        transition: opacity 0.5s ease-out;
        overflow: hidden;
    }

    .splash-logo-box {
        width: 120px;
        height: 120px;
        background: white;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px;
        margin-bottom: 20px;
        border: 2px solid rgba(255,255,255,0.1);
        box-shadow: 0 0 20px rgba(255,255,255,0.05);
        z-index: 2;
    }

    .splash-logo-box img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 50%;
    }

    .splash-app-name {
        font-size: 24px;
        font-weight: 400;
        letter-spacing: 1px;
        margin-bottom: 5px;
        text-align: center;
        z-index: 2;
    }

    .splash-version {
        font-size: 14px;
        color: #888;
        margin-bottom: 100px;
        z-index: 2;
    }

    .splash-bottom-area {
        position: absolute;
        bottom: 50px;
        width: 100%;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 2;
    }

    .splash-welcome {
        font-size: 14px;
        font-weight: 300;
        letter-spacing: 1px;
        margin-bottom: 10px;
        opacity: 0.8;
    }

    .splash-line {
        width: 150px;
        height: 3px;
        background: #4CAF50;
        border-radius: 2px;
        margin-bottom: 15px;
        animation: lineExpand 1.5s ease-in-out infinite alternate;
    }

    .splash-dots-container {
        display: flex;
        gap: 5px;
    }

    .splash-dot {
        width: 8px;
        height: 8px;
        background: #555;
        border-radius: 50%;
        animation: dotBounce 1.4s infinite ease-in-out both;
    }

    .splash-dot:nth-child(1) { animation-delay: -0.32s; }
    .splash-dot:nth-child(2) { animation-delay: -0.16s; }

    .particle {
        position: absolute;
        width: 4px;
        height: 4px;
        background: rgba(255, 255, 255, 0.5);
        border-radius: 50%;
        animation: floatUp linear infinite;
        bottom: -10px;
        z-index: 1;
    }

    @keyframes floatUp {
        0% { transform: translateY(0) scale(1); opacity: 0; }
        20% { opacity: 0.8; }
        100% { transform: translateY(-100vh) scale(0.5); opacity: 0; }
    }

    @keyframes lineExpand {
        0% { width: 50px; opacity: 0.5; }
        100% { width: 150px; opacity: 1; }
    }

    @keyframes dotBounce {
        0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
        40% { transform: scale(1); opacity: 1; background: #888; }
    }

    /* --- GLOBAL LOADER --- */
    #global-loader {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.5);
        z-index: 9999;
        display: none;
        justify-content: center;
        align-items: center;
    }
